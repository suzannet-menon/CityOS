name: civix

# Valhalla runs as the only container; the FastAPI backend is started
# manually (see scripts/start.ps1 + README step 4) so it can talk to the
# Supabase pooler directly from the host.
services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: civix_valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      - tile_urls=${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf}
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - force_rebuild=False
    restart: unless-stopped

volumes:
  valhalla_tiles:
