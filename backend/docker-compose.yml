name: civix

services:
  backend:
    build: .
    container_name: civix_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CITYOS_PROFILE=${CITYOS_PROFILE:-local}
      - VALHALLA_BASE_URL=http://valhalla:8002
    depends_on:
      - valhalla
    extra_hosts:
      # WSL2/Docker NAT has no IPv6 route; asyncpg resolves the Supabase
      # pooler to an AAAA record first and dies with errno 101. Pin an IPv4
      # ALB address so TLS SNI (and tenant routing) still use the hostname.
      - "aws-0-ap-south-1.pooler.supabase.com:3.111.105.85"
    restart: unless-stopped
    volumes:
      - ../config:/config:ro
      - ./uploads:/app/uploads

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: civix_valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      - tile_urls=${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf}
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - force_rebuild=False
    restart: unless-stopped

volumes:
  valhalla_tiles:
